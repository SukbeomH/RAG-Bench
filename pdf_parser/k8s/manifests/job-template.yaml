# PDF Parser Job Template
#
# 플레이스홀더:
#   ${BATCH_ID}     — 배치 식별자
#   ${IMAGE}        — 워커 컨테이너 이미지
#   ${PARSE_MODE}   — hybrid | document
#   ${FILE_PATTERN} — glob 패턴 (기본: *.pdf)
#   ${CPU_REQUEST}, ${CPU_LIMIT}, ${MEMORY_REQUEST}, ${MEMORY_LIMIT}
apiVersion: batch/v1
kind: Job
metadata:
  name: pdf-parse-${BATCH_ID}
  namespace: pdf-parser
  labels:
    app: pdf-parser
    batch-id: "${BATCH_ID}"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: pdf-parser
        batch-id: "${BATCH_ID}"
    spec:
      restartPolicy: OnFailure
      tolerations:
        - key: ai-platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      imagePullSecrets:
        - name: harbor-cred
      containers:
        - name: worker
          image: ${IMAGE}
          env:
            - name: INPUT_DIR
              value: "/data/input/${BATCH_ID}"
            - name: OUTPUT_DIR
              value: "/data/output/${BATCH_ID}"
            - name: PARSE_MODE
              value: "${PARSE_MODE}"
            - name: BATCH_ID
              value: "${BATCH_ID}"
            - name: FILE_PATTERN
              value: "${FILE_PATTERN}"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: parser-secrets
                  key: GEMINI_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "${CPU_REQUEST}"
              memory: "${MEMORY_REQUEST}"
            limits:
              cpu: "${CPU_LIMIT}"
              memory: "${MEMORY_LIMIT}"
          volumeMounts:
            - name: pdf-storage
              mountPath: /data
      volumes:
        - name: pdf-storage
          persistentVolumeClaim:
            claimName: pdf-storage
