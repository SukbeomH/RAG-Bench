# PDF Parser Benchmark Job Template
# 단일 (backend × pdf) 조합을 K8s Job으로 실행.
#
# 플레이스홀더:
#   ${BACKEND}   - 백엔드 (pymupdf|docling|openai|openai-4.1|upstage|upstage-enhanced|
#                          granite-vision|got-ocr2|paddleocr-vl)
#   ${PDF_FILE}  - PDF 파일명 (예: text_only.pdf)
#   ${PARSE_MODE}- 파싱 모드 (기본: direct)
#   ${JOB_NAME}  - Job 이름 (≤63자, 특수문자 제거)
#   ${RUN_ID}    - 실행 ID (타임스탬프 기반)
#   ${IMAGE}     - 컨테이너 이미지 URI
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}-${RUN_ID}
  namespace: rag-bench-test
  labels:
    app: pdf-parser-bench
    component: pdf-parser
    backend: ${BACKEND}
    run-id: ${RUN_ID}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels:
        app: pdf-parser-bench
        component: pdf-parser
        backend: ${BACKEND}
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-cred
      containers:
        - name: pdf-parser
          image: ${IMAGE}
          env:
            - name: PDF_BACKEND
              value: "${BACKEND}"
            - name: PDF_FILE
              value: "${PDF_FILE}"
            - name: PARSE_MODE
              value: "${PARSE_MODE}"
            - name: RESULTS_DIR
              value: "/results/${RUN_ID}"
            - name: BENCHMARK_PDFS_DIR
              value: "/app/benchmark_pdfs"
            # API 키 (Secret: bench-secrets)
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bench-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: UPSTAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bench-secrets
                  key: UPSTAGE_API_KEY
                  optional: true
            # OCR 오픈소스 백엔드 — K8s 내부 서비스 엔드포인트
            # granite-vision: ollama-server, got-ocr2 / paddleocr-vl: 전용 FastAPI
            # MODEL_PROFILES 기본값 사용 시 아래 설정 불필요 (주석 유지)
            # - name: OPENSOURCE_VLM_ENDPOINT
            #   value: "http://ollama-server:11434/v1"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: bench-results
