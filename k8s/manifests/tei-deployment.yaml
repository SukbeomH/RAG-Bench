# TEI (Text Embeddings Inference) — Dense 임베딩 모델 서빙.
#
# 모델별 Deployment 생성:
#   오케스트레이터가 ${MODEL_KEY}, ${MODEL_ID}, ${PORT} 치환 후 apply.
#
# 예시 (3개 모델):
#   kosimcse → BM-K/KoSimCSE-roberta-multitask, port 8081
#   e5       → intfloat/multilingual-e5-large,   port 8082
#   bge-m3   → BAAI/bge-m3,                      port 8083
#
# TEI는 OpenAI 호환 /v1/embeddings 엔드포인트 제공.
# CPU 모드: --dtype float32 (GPU 없이 동작)
#
# 플레이스홀더:
#   ${MODEL_KEY}  - 짧은 이름 (예: bge-m3)
#   ${MODEL_ID}   - HuggingFace 모델 ID (예: BAAI/bge-m3)
#   ${PORT}       - 서비스 포트 (예: 8083)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-${MODEL_KEY}
  namespace: rag-bench-test
  labels:
    app: rag-bench-test
    component: tei
    model: ${MODEL_KEY}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-bench-test
      component: tei
      model: ${MODEL_KEY}
  template:
    metadata:
      labels:
        app: rag-bench-test
        component: tei
        model: ${MODEL_KEY}
    spec:
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
          args:
            - "--model-id"
            - "${MODEL_ID}"
            - "--port"
            - "${PORT}"
            - "--dtype"
            - "float32"
            - "--max-batch-tokens"
            - "16384"
          ports:
            - containerPort: ${PORT}
              name: http
          env:
            - name: HF_HOME
              value: "/models"
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "8Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: ${PORT}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: ${PORT}
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: model-cache
              mountPath: /models
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: tei-${MODEL_KEY}
  namespace: rag-bench-test
  labels:
    app: rag-bench-test
    component: tei
    model: ${MODEL_KEY}
spec:
  selector:
    app: rag-bench-test
    component: tei
    model: ${MODEL_KEY}
  ports:
    - port: ${PORT}
      targetPort: ${PORT}
      protocol: TCP
      name: http
  type: ClusterIP
