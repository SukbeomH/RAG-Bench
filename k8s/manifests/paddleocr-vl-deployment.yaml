# PaddleOCR-VL-1.5 FastAPI 서버 K8s Deployment
# paddleocr PPStructureV3(device="cpu"), 0.9B (~3-4GB RAM)
# OpenAI-compatible API: http://paddleocr-vl-server:8000/v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paddleocr-vl-server
  namespace: rag-bench-test
  labels:
    app: paddleocr-vl-server
    component: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paddleocr-vl-server
  template:
    metadata:
      labels:
        app: paddleocr-vl-server
        component: inference
    spec:
      imagePullSecrets:
        - name: harbor-cred
      initContainers:
        - name: model-warmup
          image: ${IMAGE_REGISTRY}/rag-bench-test/paddleocr-vl:latest  # libgl1 포함 이미지 사용
          command: ["/bin/sh", "-c"]
          args:
            - |
              CACHE_DIR=/models/.paddlex/official_models
              if [ -d "$CACHE_DIR" ] && [ "$(ls -A $CACHE_DIR 2>/dev/null)" ]; then
                echo "[init] PaddleOCR 모델 캐시 발견 — 다운로드 생략"
              else
                echo "[init] PaddleOCR 모델 사전 다운로드 시작..."
                python -c "
              from paddleocr import PPStructureV3
              print('[init] 파이프라인 초기화 (모델 다운로드 포함)...')
              p = PPStructureV3(device='cpu')
              print('[init] 완료')
              "
              fi
          env:
            - name: HOME
              value: /models
          resources:
            requests:
              cpu: "1"
              memory: "5Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: paddleocr-vl
          image: ${IMAGE_REGISTRY}/rag-bench-test/paddleocr-vl:latest
          ports:
            - containerPort: 8000
              name: api
          env:
            - name: HOME
              value: /models          # PaddleOCR 캐시 → /models/.paddleocr
            - name: OMP_NUM_THREADS
              value: "4"
          resources:
            requests:
              cpu: "2"
              memory: "5Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: model-cache
              mountPath: /models
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60   # initContainer에서 모델 다운로드 완료됨
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache   # 기존 50Gi PVC 공유 (got-ocr2와 공유)
---
apiVersion: v1
kind: Service
metadata:
  name: paddleocr-vl-server
  namespace: rag-bench-test
  labels:
    app: paddleocr-vl-server
spec:
  selector:
    app: paddleocr-vl-server
  ports:
    - name: api
      port: 8000
      targetPort: 8000
  type: ClusterIP
