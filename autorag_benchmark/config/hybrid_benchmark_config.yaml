vectordb:
  # 조합 1: KoSimCSE (한국어 최적화, 768차원)
  - name: kosimcse_qdrant
    db_type: qdrant
    client_type: docker
    embedding_model:
      - type: huggingface
        model_name: BM-K/KoSimCSE-roberta-multitask
    collection_name: kosimcse
    similarity_metric: cosine
    embedding_batch: 64
    dimension: 768

  # 조합 2: E5 multilingual (다국어 균형, 1024차원)
  - name: e5_qdrant
    db_type: qdrant
    client_type: docker
    embedding_model:
      - type: huggingface
        model_name: intfloat/multilingual-e5-large
    collection_name: e5_large
    similarity_metric: cosine
    embedding_batch: 64
    dimension: 1024

  # 조합 3: BGE-M3 (올인원, 1024차원)
  - name: bge_m3_qdrant
    db_type: qdrant
    client_type: docker
    embedding_model:
      - type: huggingface
        model_name: BAAI/bge-m3
    collection_name: bge_m3
    similarity_metric: cosine
    embedding_batch: 64
    dimension: 1024

  # 조합 4: MiniLM (경량, 384차원)
  - name: minilm_qdrant
    db_type: qdrant
    client_type: docker
    embedding_model:
      - type: huggingface
        model_name: sentence-transformers/all-MiniLM-L6-v2
    collection_name: minilm
    similarity_metric: cosine
    embedding_batch: 128
    dimension: 384

node_lines:
  # 1단계: Retrieval (Dense → Sparse → Hybrid Fusion → Reranker)
  - node_line_name: retrieve_node_line
    nodes:
      # Dense Retrieval: 4개 임베딩 모델 비교
      - node_type: semantic_retrieval
        top_k: 10
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision]
        modules:
          - module_type: vectordb
            vectordb: [kosimcse_qdrant, e5_qdrant, bge_m3_qdrant, minilm_qdrant]

      # Sparse Retrieval: BM25 한국어 토크나이저 비교
      - node_type: lexical_retrieval
        top_k: 10
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision]
        modules:
          - module_type: bm25
            bm25_tokenizer: [ko_kiwi, ko_okt]

      # Hybrid Fusion: Dense + Sparse 결합 (RRF, CC)
      - node_type: hybrid_retrieval
        top_k: 10
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision]
        modules:
          - module_type: hybrid_rrf
            weight_range: (4, 80)
          - module_type: hybrid_cc
            normalize_method: [mm, tmm]
            weight_range: (0.0, 1.0)
            test_weight_size: 51

      # Reranker: 검색 결과 재순위화
      - node_type: passage_reranker
        top_k: 5
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision]
        modules:
          - module_type: pass_reranker
          - module_type: koreranker
          - module_type: flashrank_reranker

  # 2단계: Generation (Prompt → LLM)
  - node_line_name: post_retrieve_node_line
    nodes:
      - node_type: prompt_maker
        strategy:
          metrics: [bleu, meteor, rouge]
          generator_modules:
            - module_type: llama_index_llm
              llm: openai
              model: [gpt-4o-mini]
        modules:
          - module_type: fstring
            prompt:
              - "주어진 문맥을 바탕으로 질문에 답하시오.\n\n문맥:\n{retrieved_contents}\n\n질문: {query}\n\n답변:"
              - "다음 참고 자료를 활용하여 질문에 정확하게 답하세요.\n\n참고 자료:\n{retrieved_contents}\n\n질문: {query}\n\n답변:"

      - node_type: generator
        strategy:
          metrics:
            - metric_name: rouge
            - metric_name: bleu
            - metric_name: meteor
            - metric_name: sem_score
              embedding_model: openai
        modules:
          - module_type: llama_index_llm
            llm: openai
            model: [gpt-4o-mini]
            temperature: [0, 0.3]
