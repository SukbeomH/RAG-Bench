[project]
name = "autorag-pdf-eval"
version = "0.1.0"
description = "PDF parsing benchmark — NED/TEDS metrics"
requires-python = ">=3.12"
dependencies = [
    "autorag-parsers",
    "rapidfuzz>=3.14",
]

[tool.uv.sources]
autorag-parsers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autorag_pdf_eval"]
