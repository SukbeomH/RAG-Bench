[project]
name = "autorag-retrieval"
version = "0.1.0"
description = "RAG retrieval strategies — Dense+Sparse hybrid, reranking"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langchain-community>=0.3",
    "langchain-core>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-openai>=0.2",
    "langchain-qdrant>=0.2",
    "langchain-text-splitters>=0.3",
    "qdrant-client>=1.11",
    "sentence-transformers>=3.1",
    "torch>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
colbert = ["pylate>=1.0"]
flashrank = ["flashrank>=0.2"]
upstage = ["langchain-upstage>=0.3"]
ollama = ["langchain-ollama>=0.2"]
all = ["autorag-retrieval[colbert,flashrank,upstage,ollama]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autorag_retrieval"]
