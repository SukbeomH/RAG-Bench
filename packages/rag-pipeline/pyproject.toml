[project]
name = "autorag-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "autorag-parsers",
    "autorag-retrieval",
]

[project.scripts]
autorag-pipeline = "autorag_pipeline.integration.cli:main"

[tool.uv.sources]
autorag-parsers = { workspace = true }
autorag-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autorag_pipeline"]
