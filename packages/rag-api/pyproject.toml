[project]
name = "autorag-api"
version = "0.1.0"
description = "FastAPI service — PDF parsing, RAG retrieval, citation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    "autorag-parsers",
    "autorag-retrieval",
]

[tool.uv.sources]
autorag-parsers = { workspace = true }
autorag-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autorag_api"]
