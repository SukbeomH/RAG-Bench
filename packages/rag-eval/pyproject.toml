[project]
name = "autorag-rag-eval"
version = "0.1.0"
description = "RAG evaluation — RAGAS metrics"
requires-python = ">=3.12"
dependencies = [
    "ragas>=0.4.3",
    "langchain-openai>=0.2",
    "autorag-retrieval",
]

[tool.uv.sources]
autorag-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autorag_rag_eval"]
