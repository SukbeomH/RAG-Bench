[project]
name = "autorag-parsers"
version = "0.1.0"
description = "PDF → Markdown conversion with multiple backends"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.26.7",
    "pymupdf4llm>=0.0.17",
]

[project.optional-dependencies]
docling = ["docling>=2.75"]
openai = ["openai>=1.0"]
upstage = ["requests"]
# all은 docling 제외 (transformers>=4.49 ↔ langchain-upstage tokenizers 충돌)
# docling은 별도: uv sync --package autorag-parsers --extra docling
all = ["autorag-parsers[openai,upstage]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autorag_parsers"]
