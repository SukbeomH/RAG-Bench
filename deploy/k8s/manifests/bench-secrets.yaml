# bench-secrets — API 키 Secret
# !! 실제 키는 여기에 직접 입력하지 말고 kubectl create secret으로 생성하세요.
#
# 생성 방법 (프로젝트 루트에서):
#   source .env
#   kubectl -n rag-bench-test create secret generic bench-secrets \
#     --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
#     --from-literal=UPSTAGE_API_KEY="$UPSTAGE_API_KEY" \
#     --from-literal=GEMINI_API_KEY="${GEMINI_API_KEY:-}" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# 확인:
#   kubectl -n rag-bench-test get secret bench-secrets
#   kubectl -n rag-bench-test describe secret bench-secrets
apiVersion: v1
kind: Secret
metadata:
  name: bench-secrets
  namespace: rag-bench-test
type: Opaque
# stringData:
#   OPENAI_API_KEY: "<실제 키를 직접 입력하지 마세요>"
#   UPSTAGE_API_KEY: "<실제 키를 직접 입력하지 마세요>"
#   GEMINI_API_KEY: "<실제 키를 직접 입력하지 마세요>"
