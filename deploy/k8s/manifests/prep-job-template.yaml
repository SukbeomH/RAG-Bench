# Phase 1: 카테고리별 데이터 준비 Job.
# HF 데이터 로드 + 청킹 + Contextual enrichment (OpenAI)
# 결과를 /results/<category>/prepared/ 에 직렬화.
#
# 플레이스홀더:
#   ${CATEGORY}, ${RUN_ID}, ${IMAGE}
#   ${MAX_CORPUS}, ${MAX_QUERIES}, ${CONTEXTUAL_LLM}
#   ${CPU_REQUEST}, ${CPU_LIMIT}, ${MEMORY_REQUEST}, ${MEMORY_LIMIT}
apiVersion: batch/v1
kind: Job
metadata:
  name: prep-${CATEGORY}-${RUN_ID}
  namespace: rag-bench-test
  labels:
    app: rag-bench-test
    component: prep
    category: ${CATEGORY}
    run-id: ${RUN_ID}
    phase: prep
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: rag-bench-test
        component: prep
        category: ${CATEGORY}
        phase: prep
    spec:
      restartPolicy: OnFailure
      tolerations:
        - key: ai-platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      imagePullSecrets:
        - name: harbor-cred
      containers:
        - name: worker
          image: ${IMAGE}
          env:
            - name: WORKER_PHASE
              value: "prep"
            - name: BENCH_CATEGORY
              value: "${CATEGORY}"
            - name: BENCH_MAX_CORPUS
              value: "${MAX_CORPUS}"
            - name: BENCH_MAX_QUERIES
              value: "${MAX_QUERIES}"
            - name: CONTEXTUAL_LLM
              value: "${CONTEXTUAL_LLM}"
            - name: RESULTS_DIR
              value: "/results"
            - name: HF_HOME
              value: "/models"
            - name: LLM_PROVIDER
              value: "openai"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bench-secrets
                  key: OPENAI_API_KEY
            - name: UPSTAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bench-secrets
                  key: UPSTAGE_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "${CPU_REQUEST}"
              memory: "${MEMORY_REQUEST}"
            limits:
              cpu: "${CPU_LIMIT}"
              memory: "${MEMORY_LIMIT}"
          volumeMounts:
            - name: results
              mountPath: /results
            - name: model-cache
              mountPath: /models
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: bench-results
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
