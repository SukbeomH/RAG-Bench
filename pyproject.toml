[tool.uv.workspace]
members = [
    "packages/pdf-parsers",
    "packages/pdf-eval",
    "packages/rag-retrieval",
    "packages/rag-eval",
    "packages/rag-api",
    "packages/rag-pipeline",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
