[project]
name = "rag-bench"
version = "0.1.0"
description = "Modular RAG Benchmark System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langchain-community>=0.3",
    "langchain-core>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "langchain-qdrant>=0.2",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "qdrant-client>=1.11",
    "pymupdf4llm>=0.0.17",
    "konlpy>=0.6.0",
    "pandas>=2.2",
    "psutil>=5.9",
    "fastembed>=0.4",
    "pylate>=1.0",
    "sentence-transformers>=3.1",
    "transformers>=4.40",
    "torch>=2.2",
    "flashrank>=0.2",
    "langchain-upstage>=0.3",
    "python-dotenv>=1.0",
    "jupyter>=1.0",
    "ipython>=8.27",
    "ragas>=0.4.3",
    "einops>=0.8.2",
    "matplotlib>=3.10.8",
    "rapidfuzz>=3.14.3",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pymupdf>=1.26.7",
    "docling>=2.75.0",
]

[tool.hatch.build.targets.wheel]
packages = ["rag_bench"]
